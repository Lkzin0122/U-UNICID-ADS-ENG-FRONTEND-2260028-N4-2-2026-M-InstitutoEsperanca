name: Security

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 12 * * 1'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Scan current files and archives for secrets
        shell: bash
        run: |
          set -euo pipefail
          tool_dir="$(mktemp -d)"
          curl --fail --silent --show-error --location \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$tool_dir/gitleaks.tar.gz"
          printf '%s  %s\n' '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' "$tool_dir/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$tool_dir/gitleaks.tar.gz" -C "$tool_dir" gitleaks
          "$tool_dir/gitleaks" dir . --config .gitleaks.toml --redact=100 --max-archive-depth=3 --max-decode-depth=3 --no-banner
      - name: Audit npm lockfile
        run: npm audit
      - name: Audit Python tools and vendored libraries
        run: python3 -B scripts/check_dependencies.py
